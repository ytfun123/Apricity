<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apricity</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        * { box-sizing: border-box; }

        :root {
            --md-sys-color-primary: #8B5000;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #FFDCC0;
            --md-sys-color-on-primary-container: #2D1600;
            --md-sys-color-surface: #FFFBFF;
            --md-sys-color-on-surface: #201A17;
            --md-sys-color-outline: #85736B;
            --font-ui: 'Outfit', sans-serif;
            --font-logo: 'Great Vibes', cursive;
        }

        [data-theme="orange-dark"] {
            --md-sys-color-primary: #FFB870;
            --md-sys-color-primary-container: #693C00;
            --md-sys-color-on-primary-container: #FFDCC0;
            --md-sys-color-surface: #201A17;
            --md-sys-color-on-surface: #ECE0DA;
            --md-sys-color-outline: #9F8D84;
        }
        [data-theme="blue-light"] {
            --md-sys-color-primary: #0061A4;
            --md-sys-color-primary-container: #D1E4FF;
            --md-sys-color-on-primary-container: #001D36;
            --md-sys-color-surface: #FDFCFF;
            --md-sys-color-on-surface: #1A1C1E;
        }
        [data-theme="blue-dark"] {
            --md-sys-color-primary: #A4C9FE;
            --md-sys-color-primary-container: #00497E;
            --md-sys-color-on-primary-container: #D1E4FF;
            --md-sys-color-surface: #1A1C1E;
            --md-sys-color-on-surface: #E2E2E6;
        }
        [data-theme="green-light"] {
            --md-sys-color-primary: #006D3A;
            --md-sys-color-primary-container: #98F7B5;
            --md-sys-color-on-primary-container: #00210E;
            --md-sys-color-surface: #FBFDF8;
        }
        [data-theme="green-dark"] {
            --md-sys-color-primary: #7CDB96;
            --md-sys-color-primary-container: #00522A;
            --md-sys-color-on-primary-container: #98F7B5;
            --md-sys-color-surface: #191C1A;
            --md-sys-color-on-surface: #E1E3DF;
        }
        [data-theme="lavender-light"] {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-surface: #FFFBFE;
        }
        [data-theme="lavender-dark"] {
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-primary-container: #4F378B;
            --md-sys-color-on-primary-container: #EADDFF;
            --md-sys-color-surface: #1C1B1F;
            --md-sys-color-on-surface: #E6E1E5;
        }
        [data-theme="amoled"] {
            --md-sys-color-primary: #FFFFFF;
            --md-sys-color-primary-container: #333333;
            --md-sys-color-on-primary-container: #FFFFFF;
            --md-sys-color-surface: #000000;
            --md-sys-color-on-surface: #FFFFFF;
            --md-sys-color-outline: #444444;
        }
        [data-theme="amoled-inverted"] {
            --md-sys-color-primary: #000000;
            --md-sys-color-primary-container: #E8E8E8;
            --md-sys-color-on-primary-container: #000000;
            --md-sys-color-surface: #FFFFFF;
            --md-sys-color-on-surface: #000000;
            --md-sys-color-outline: #8A8A8A;
        }

        body {
            margin: 0; padding: 0;
            font-family: var(--font-ui);
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== PAGES ===== */
        .page { display: none; }
        .page.active { display: block; }

        /* ===== HOME PAGE ===== */
        #home-page {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        #home-page.active { display: flex; }

        .settings-trigger {
            position: fixed; top: 20px; right: 20px;
            cursor: pointer; width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; color: var(--md-sys-color-primary);
            z-index: 50;
        }
        .settings-trigger:hover { background: var(--md-sys-color-primary-container); }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center; z-index: 100;
        }
        .modal {
            background: var(--md-sys-color-surface);
            padding: 24px; border-radius: 28px;
            width: 350px; max-height: 80vh;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
        }
        .theme-list { overflow-y: auto; margin-top: 16px; padding-right: 8px; }
        .theme-option {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; margin: 4px 0;
            cursor: pointer; border-radius: 16px;
            transition: background 0.2s; font-weight: 500;
        }
        .theme-option:hover { background: var(--md-sys-color-primary-container); }
        .color-preview { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }

        .main-content {
            width: 100%; max-width: 600px;
            display: flex; flex-direction: column;
            align-items: center; text-align: center; padding: 0 20px;
        }
        .logo {
            font-family: var(--font-logo);
            font-size: 6.5rem;
            color: var(--md-sys-color-primary);
            margin-bottom: 10px;
            user-select: none;
            transition: color 0.4s;
        }
        .search-container { position: relative; width: 100%; margin-bottom: 30px; }
        .search-bar {
            width: 100%; padding: 20px 24px 20px 64px;
            font-size: 1.1rem; font-family: var(--font-ui);
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 32px; background: transparent;
            color: var(--md-sys-color-on-surface); outline: none;
            transition: all 0.3s;
        }
        .search-bar:focus {
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .search-icon {
            position: absolute; left: 24px; top: 50%;
            transform: translateY(-50%);
            color: var(--md-sys-color-primary);
        }
        .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .btn {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border: none; padding: 12px 28px; border-radius: 100px;
            cursor: pointer; font-family: var(--font-ui); font-weight: 500;
            transition: transform 0.1s, background 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn:active { transform: scale(0.95); }

        /* YouTube button special style */
        .btn-youtube {
            background: #FF0000;
            color: #FFFFFF;
        }
        .btn-youtube:hover { background: #cc0000; }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.85rem;
            opacity: 0.7;
            text-align: center;
            min-height: 24px;
            transition: opacity 0.6s ease-in-out;
        }

        /* ===== YOUTUBE PAGE ===== */
        #youtube-page {
            min-height: 100vh;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            padding: 20px;
        }

        .yt-topbar {
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 24px; flex-wrap: wrap;
        }
        .back-btn {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border: none; padding: 10px 20px; border-radius: 100px;
            cursor: pointer; font-family: var(--font-ui); font-weight: 500;
            display: flex; align-items: center; gap: 6px;
            transition: transform 0.1s;
        }
        .back-btn:active { transform: scale(0.95); }

        .yt-logo {
            font-family: var(--font-logo);
            font-size: 2.2rem;
            color: var(--md-sys-color-primary);
            user-select: none;
        }

        .yt-search-row {
            display: flex; gap: 8px; flex: 1; min-width: 240px;
        }
        .yt-search-input {
            flex: 1; padding: 12px 20px;
            font-size: 1rem; font-family: var(--font-ui);
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 32px; background: transparent;
            color: var(--md-sys-color-on-surface); outline: none;
            transition: border-color 0.3s;
        }
        .yt-search-input:focus { border-color: var(--md-sys-color-primary); }
        .yt-search-btn {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none; padding: 12px 24px; border-radius: 100px;
            cursor: pointer; font-family: var(--font-ui); font-weight: 500;
            display: flex; align-items: center; gap: 6px;
            transition: opacity 0.2s;
        }
        .yt-search-btn:hover { opacity: 0.85; }

        #yt-player {
            width: 100%;
            max-width: 960px;
            margin: 0 auto 28px auto;
        }

        .yt-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .video-card {
            background: var(--md-sys-color-primary-container);
            border-radius: 16px;
            overflow: hidden;
        }
        .video-card img { width: 100%; display: block; }
        .video-card-body { padding: 12px; }
        .video-card h3 {
            font-size: 14px; margin: 0 0 4px 0;
            color: var(--md-sys-color-on-primary-container);
        }
        .video-card p {
            font-size: 12px; color: var(--md-sys-color-on-primary-container);
            opacity: 0.7; margin: 0 0 10px 0;
        }
        .video-card-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .vc-btn {
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            border: none; padding: 7px 14px; border-radius: 100px;
            cursor: pointer; font-family: var(--font-ui); font-size: 12px;
            font-weight: 500; transition: opacity 0.2s;
        }
        .vc-btn:hover { opacity: 0.75; }

        .yt-status {
            text-align: center; padding: 40px;
            opacity: 0.6; font-size: 1rem;
        }
    </style>
</head>
<body data-theme="orange-light">

    <!-- Settings button (always visible) -->
    <div class="settings-trigger" onclick="toggleModal()">
        <span class="material-symbols-outlined">palette</span>
    </div>

    <!-- Theme Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="toggleModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <h2 style="margin:0; font-weight: 500;">Themes</h2>
            <div class="theme-list">
                <div class="theme-option" onclick="setTheme('orange-light')">
                    <div class="color-preview" style="background: #8B5000;"></div> Winter Sun
                </div>
                <div class="theme-option" onclick="setTheme('orange-dark')">
                    <div class="color-preview" style="background: #FFB870;"></div> Winter Night
                </div>
                <div class="theme-option" onclick="setTheme('blue-light')">
                    <div class="color-preview" style="background: #0061A4;"></div> Ocean Breeze
                </div>
                <div class="theme-option" onclick="setTheme('blue-dark')">
                    <div class="color-preview" style="background: #A4C9FE;"></div> Deep Sea
                </div>
                <div class="theme-option" onclick="setTheme('green-light')">
                    <div class="color-preview" style="background: #006D3A;"></div> Forest Path
                </div>
                <div class="theme-option" onclick="setTheme('green-dark')">
                    <div class="color-preview" style="background: #7CDB96;"></div> Emerald Dark
                </div>
                <div class="theme-option" onclick="setTheme('lavender-light')">
                    <div class="color-preview" style="background: #6750A4;"></div> Lavender Mist
                </div>
                <div class="theme-option" onclick="setTheme('lavender-dark')">
                    <div class="color-preview" style="background: #D0BCFF;"></div> Twilight Purple
                </div>
                <div class="theme-option" onclick="setTheme('amoled')">
                    <div class="color-preview" style="background: #000000;"></div> Midnight Noire
                </div>
                <div class="theme-option" onclick="setTheme('amoled-inverted')">
                    <div class="color-preview" style="background: #FFFFFF; border-color: #8A8A8A;"></div> Snow White
                </div>
            </div>
            <button class="btn" style="width:100%; margin-top: 20px;" onclick="toggleModal()">Close</button>
        </div>
    </div>

    <!-- ===== HOME PAGE ===== -->
    <div id="home-page" class="page active">
        <div class="main-content">
            <div class="logo">Apricity</div>

            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" id="homeSearch" placeholder="Type to start searching..." autofocus
                    onkeydown="if(event.key==='Enter') goSearch()">
            </div>

            <div class="btn-group">
                <button class="btn">Apps</button>
                <button class="btn">Games</button>
                <button class="btn btn-youtube" onclick="showYouTube()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.8 15.5V8.5l6.3 3.5-6.3 3.5z"/>
                    </svg>
                    YouTube
                </button>
            </div>
        </div>

        <footer id="rotating-footer"></footer>
    </div>

    <!-- ===== YOUTUBE PAGE ===== -->
    <div id="youtube-page" class="page">
        <div class="yt-topbar">
            <button class="back-btn" onclick="showHome()">
                <span class="material-symbols-outlined" style="font-size:18px;">arrow_back</span>
                Back
            </button>
            <div class="yt-logo">Apricity</div>
            <div class="yt-search-row">
                <input type="text" class="yt-search-input" id="ytSearchInput" placeholder="Search YouTube..."
                    onkeydown="if(event.key==='Enter') searchVideos()">
                <button class="yt-search-btn" onclick="searchVideos()">
                    <span class="material-symbols-outlined" style="font-size:18px;">search</span>
                    Search
                </button>
            </div>
        </div>

        <div id="yt-player"></div>
        <div id="yt-status" class="yt-status">Search for a video to get started 🎬</div>
        <div id="yt-results" class="yt-results"></div>
    </div>

    <script>
        const API_KEY = "AIzaSyB7x5zyGdt3_9JnaIWqQYrvNkcB6lef_xA";

        // ===== NAVIGATION =====
        function showYouTube() {
            document.getElementById('home-page').classList.remove('active');
            document.getElementById('youtube-page').classList.add('active');
            setTimeout(() => document.getElementById('ytSearchInput').focus(), 100);
        }

        function showHome() {
            document.getElementById('youtube-page').classList.remove('active');
            document.getElementById('home-page').classList.add('active');
        }

        function goSearch() {
            const q = document.getElementById('homeSearch').value.trim();
            if (q) window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
        }

        // ===== THEME =====
        function toggleModal() {
            const modal = document.getElementById('modalOverlay');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('apricity-theme-choice', theme);
        }

        // ===== YOUTUBE =====
        async function searchVideos() {
            const query = document.getElementById('ytSearchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('yt-results');
            const statusDiv = document.getElementById('yt-status');
            resultsDiv.innerHTML = '';
            statusDiv.textContent = 'Loading...';

            try {
                const url =
                    'https://www.googleapis.com/youtube/v3/search' +
                    '?part=snippet' +
                    '&maxResults=20' +
                    '&type=video' +
                    '&q=' + encodeURIComponent(query) +
                    '&key=' + API_KEY;

                const response = await fetch(url);
                const data = await response.json();

                statusDiv.textContent = '';

                if (!data.items || data.items.length === 0) {
                    statusDiv.textContent = 'No videos found.';
                    return;
                }

                data.items.forEach(item => {
                    const videoId = item.id.videoId;
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML =
                        '<img src="' + item.snippet.thumbnails.medium.url + '" alt="thumbnail">' +
                        '<div class="video-card-body">' +
                            '<h3>' + item.snippet.title + '</h3>' +
                            '<p>' + item.snippet.channelTitle + '</p>' +
                            '<div class="video-card-btns">' +
                                '<button class="vc-btn" onclick="playVideo(\'' + videoId + '\')">▶ Play</button>' +
                                '<button class="vc-btn" onclick="window.open(\'https://www.youtube.com/watch?v=' + videoId + '\',\'_blank\')">Open</button>' +
                                '<button class="vc-btn" onclick="window.open(\'https://www.youtube.com/shorts/' + videoId + '\',\'_blank\')">Short</button>' +
                            '</div>' +
                        '</div>';
                    resultsDiv.appendChild(card);
                });
            } catch(err) {
                console.error(err);
                statusDiv.textContent = 'Error loading videos. Check your API key.';
            }
        }

        function playVideo(videoId) {
            const player = document.getElementById('yt-player');
            player.innerHTML =
                '<iframe width="100%" height="500"' +
                ' src="https://www.youtube.com/embed/' + videoId + '?autoplay=1"' +
                ' title="YouTube Video Player" frameborder="0"' +
                ' allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"' +
                ' allowfullscreen></iframe>';
            player.scrollIntoView({ behavior: 'smooth' });
        }

        // ===== FOOTER =====
        const footerMessages = [
            "shoutout to utopia and aspen",
            "made with love by bored middle schoolers, for everyone else",
            "goonguardian & freakurely",
            "better than kahoot, blooket, and gimkit",
            "if ur school blocks this, be proactive and (dont) send them an email",
            "&quot;erm i use arch btw&quot; like sthu",
            "like i guess bro",
            "we're not responsible if you get in trouble lol",
            "props to t-hops",
            "join our discord server",
            "with the power of proxies",
            "print(&quot;Hello, World!&quot;)",
            "check out capticlient-pybricks-custom-client.pages.dev",
            "why are you even reading this"
        ];

        let currentIndex = 0;
        const footer = document.getElementById('rotating-footer');

        function rotateFooter() {
            footer.style.opacity = 0;
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % footerMessages.length;
                footer.innerHTML = footerMessages[currentIndex];
                footer.style.opacity = 1;
            }, 600);
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('apricity-theme-choice');
            if (savedTheme) setTheme(savedTheme);
            footer.innerHTML = footerMessages[0];
            setInterval(rotateFooter, 4000);
        };
    </script>
</body>
</html>
