<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apricity</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --md-sys-color-primary: #8B5000;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #FFDCC0;
            --md-sys-color-on-primary-container: #2D1600;
            --md-sys-color-surface: #FFFBFF;
            --md-sys-color-on-surface: #201A17;
            --md-sys-color-outline: #85736B;
            --font-ui: 'Outfit', sans-serif;
            --font-logo: 'Great Vibes', cursive;
            --yt-surface: color-mix(in srgb, var(--md-sys-color-surface) 95%, var(--md-sys-color-primary) 5%);
            --yt-surface2: color-mix(in srgb, var(--md-sys-color-primary-container) 30%, var(--md-sys-color-surface) 70%);
            --yt-border: color-mix(in srgb, var(--md-sys-color-outline) 20%, transparent 80%);
            --yt-border2: color-mix(in srgb, var(--md-sys-color-outline) 35%, transparent 65%);
            --yt-muted: var(--md-sys-color-outline);
            --bg-overlay: transparent;
        }

        [data-theme="orange-dark"] {
            --md-sys-color-primary: #FFB870;
            --md-sys-color-primary-container: #693C00;
            --md-sys-color-on-primary-container: #FFDCC0;
            --md-sys-color-surface: #201A17;
            --md-sys-color-on-surface: #ECE0DA;
            --md-sys-color-outline: #9F8D84;
        }
        [data-theme="blue-light"] {
            --md-sys-color-primary: #0061A4;
            --md-sys-color-primary-container: #D1E4FF;
            --md-sys-color-on-primary-container: #001D36;
            --md-sys-color-surface: #FDFCFF;
            --md-sys-color-on-surface: #1A1C1E;
        }
        [data-theme="blue-dark"] {
            --md-sys-color-primary: #A4C9FE;
            --md-sys-color-primary-container: #00497E;
            --md-sys-color-on-primary-container: #D1E4FF;
            --md-sys-color-surface: #1A1C1E;
            --md-sys-color-on-surface: #E2E2E6;
        }
        [data-theme="green-light"] {
            --md-sys-color-primary: #006D3A;
            --md-sys-color-primary-container: #98F7B5;
            --md-sys-color-on-primary-container: #00210E;
            --md-sys-color-surface: #FBFDF8;
            --md-sys-color-on-surface: #1A1C19;
            --md-sys-color-outline: #72796F;
        }
        [data-theme="green-dark"] {
            --md-sys-color-primary: #7CDB96;
            --md-sys-color-primary-container: #00522A;
            --md-sys-color-on-primary-container: #98F7B5;
            --md-sys-color-surface: #191C1A;
            --md-sys-color-on-surface: #E1E3DF;
            --md-sys-color-outline: #8C9389;
        }
        [data-theme="lavender-light"] {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-surface: #FFFBFE;
            --md-sys-color-on-surface: #1C1B1F;
            --md-sys-color-outline: #79747E;
        }
        [data-theme="lavender-dark"] {
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-primary-container: #4F378B;
            --md-sys-color-on-primary-container: #EADDFF;
            --md-sys-color-surface: #1C1B1F;
            --md-sys-color-on-surface: #E6E1E5;
            --md-sys-color-outline: #938F99;
        }
        [data-theme="amoled"] {
            --md-sys-color-primary: #FFFFFF;
            --md-sys-color-primary-container: #333333;
            --md-sys-color-on-primary-container: #FFFFFF;
            --md-sys-color-surface: #000000;
            --md-sys-color-on-surface: #FFFFFF;
            --md-sys-color-outline: #444444;
        }
        [data-theme="amoled-inverted"] {
            --md-sys-color-primary: #000000;
            --md-sys-color-primary-container: #E8E8E8;
            --md-sys-color-on-primary-container: #000000;
            --md-sys-color-surface: #FFFFFF;
            --md-sys-color-on-surface: #000000;
            --md-sys-color-outline: #8A8A8A;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s;
            position: relative;
            min-height: 100vh;
        }

        /* ===== BACKGROUND SYSTEM ===== */
        #bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        #bg-layer.bg-none { opacity: 0; }
        #bg-layer.bg-active { opacity: 1; }

        /* All content sits above bg */
        #home-page, #sunlit-page, #youtube-page, .settings-trigger, .modal-overlay, .apps-overlay {
            position: relative;
            z-index: 1;
        }

        /* Frosted glass effect on home when bg is active */
        body.has-bg #home-page .main-content {
            background: color-mix(in srgb, var(--md-sys-color-surface) 70%, transparent 30%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 40px 40px 32px;
            border: 1px solid color-mix(in srgb, var(--md-sys-color-outline) 20%, transparent 80%);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--yt-border2); border-radius: 3px; }

        .page { display: none; }
        .page.active { display: block; }

        /* HOME PAGE */
        #home-page {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; position: relative;
        }
        #home-page.active { display: flex; }

        /* Top-right icon cluster */
        .topbar-icons {
            position: fixed; top: 16px; right: 16px;
            display: flex; gap: 6px; z-index: 50;
        }
        .icon-btn {
            cursor: pointer; width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; color: var(--md-sys-color-primary);
            background: color-mix(in srgb, var(--md-sys-color-surface) 80%, transparent 20%);
            backdrop-filter: blur(8px);
            border: 1px solid color-mix(in srgb, var(--md-sys-color-outline) 20%, transparent 80%);
        }
        .icon-btn:hover { background: var(--md-sys-color-primary-container); }

        /* ===== MODAL BASE ===== */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: var(--md-sys-color-surface);
            padding: 24px; border-radius: 28px;
            width: 380px; max-height: 85vh;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .modal-tabs {
            display: flex; gap: 4px; margin: 14px 0 6px;
            background: var(--yt-surface2);
            border-radius: 100px; padding: 3px;
        }
        .modal-tab {
            flex: 1; padding: 8px; border-radius: 100px;
            border: none; background: transparent;
            color: var(--md-sys-color-outline);
            font-family: var(--font-ui); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .modal-tab.active {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }
        .modal-tab-content { display: none; overflow-y: auto; flex: 1; padding-right: 4px; }
        .modal-tab-content.active { display: block; }

        .theme-list { overflow-y: auto; padding-right: 4px; }
        .theme-option {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 14px; margin: 3px 0;
            cursor: pointer; border-radius: 14px;
            transition: background 0.2s; font-weight: 500; font-size: 14px;
        }
        .theme-option:hover { background: var(--md-sys-color-primary-container); }
        .color-preview { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0; }

        /* ===== BACKGROUND PICKER ===== */
        .bg-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; padding: 4px 0;
        }
        .bg-option {
            border-radius: 14px; overflow: hidden;
            cursor: pointer; border: 2px solid transparent;
            transition: border-color 0.2s, transform 0.15s;
            aspect-ratio: 16/10;
            position: relative;
        }
        .bg-option:hover { transform: scale(1.03); }
        .bg-option.selected { border-color: var(--md-sys-color-primary); }
        .bg-option-inner {
            width: 100%; height: 100%;
            display: flex; align-items: flex-end;
            padding: 8px;
        }
        .bg-option-label {
            font-size: 11px; font-weight: 600;
            color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            background: rgba(0,0,0,0.35); padding: 3px 7px; border-radius: 6px;
        }
        /* None option */
        .bg-none-opt {
            background: repeating-conic-gradient(var(--yt-surface2) 0% 25%, var(--md-sys-color-surface) 0% 50%) 0 0 / 14px 14px;
        }
        .bg-1  { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
        .bg-2  { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460, #533483); }
        .bg-3  { background: linear-gradient(135deg, #0d1117, #1f4037, #99f2c8); }
        .bg-4  { background: linear-gradient(160deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3); }
        .bg-5  { background: radial-gradient(ellipse at top, #1a0533 0%, #0d0d0d 60%); }
        .bg-6  { background: linear-gradient(135deg, #005c97, #363795); }
        .bg-7  { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%); background-image: radial-gradient(circle at 20% 50%, rgba(255,165,0,0.1) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,100,0,0.08) 0%, transparent 40%), linear-gradient(135deg, #0a0a0a, #1a1a1a); }
        .bg-8  { background: linear-gradient(135deg, #667eea, #764ba2); }
        .bg-9  { background: conic-gradient(from 180deg at 50% 50%, #f3e7e9 0deg, #e3eeff 120deg, #f3e7e9 240deg, #e3eeff 360deg); }
        .bg-10 { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .bg-11 { background: linear-gradient(160deg, #2c3e50, #fd746c); }
        .bg-12 { background: repeating-linear-gradient(45deg, #0a0a0a 0px, #0a0a0a 2px, #111 2px, #111 12px); }

        .bg-custom-row {
            margin-top: 12px;
            border-top: 1px solid var(--yt-border2);
            padding-top: 12px;
        }
        .bg-custom-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--yt-border2);
            background: var(--yt-surface2);
            color: var(--md-sys-color-on-surface);
            font-family: var(--font-ui); font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
            margin-top: 6px;
        }
        .bg-custom-input:focus { border-color: var(--md-sys-color-primary); }
        .field-label-sm {
            font-size: 11px; color: var(--md-sys-color-outline);
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
        }

        /* ===== SETTINGS PANEL ===== */
        .settings-section { margin: 12px 0; }
        .settings-section-title {
            font-size: 11px; color: var(--md-sys-color-outline);
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
            margin-bottom: 8px; padding-bottom: 4px;
            border-bottom: 1px solid var(--yt-border2);
        }
        .setting-row {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 14px; padding: 10px 2px;
            border-bottom: 1px solid var(--yt-border);
        }
        .setting-row:last-child { border-bottom: none; }
        .setting-info { flex: 1; }
        .setting-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .setting-desc { font-size: 12px; color: var(--md-sys-color-outline); line-height: 1.4; }

        /* Toggle switch */
        .toggle-switch {
            position: relative; width: 44px; height: 24px;
            flex-shrink: 0; margin-top: 2px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer;
            inset: 0; border-radius: 24px;
            background: var(--md-sys-color-outline);
            transition: background 0.3s;
        }
        .toggle-slider::before {
            content: ''; position: absolute;
            width: 18px; height: 18px; border-radius: 50%;
            background: white; left: 3px; bottom: 3px;
            transition: transform 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider { background: var(--md-sys-color-primary); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }

        /* Hide status badge */
        .hide-status {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 11px; font-weight: 600; padding: 3px 8px;
            border-radius: 100px; margin-top: 4px;
        }
        .hide-status.active { background: color-mix(in srgb, #4caf50 15%, transparent); color: #4caf50; }
        .hide-status.inactive { background: color-mix(in srgb, var(--md-sys-color-outline) 15%, transparent); color: var(--md-sys-color-outline); }
        .hide-status.warn { background: color-mix(in srgb, #ff9800 15%, transparent); color: #ff9800; }
        .hide-status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .main-content {
            width: 100%; max-width: 600px;
            display: flex; flex-direction: column;
            align-items: center; text-align: center; padding: 0 20px;
            transition: all 0.4s ease;
        }
        .logo {
            font-family: var(--font-logo);
            font-size: 6.5rem;
            color: var(--md-sys-color-primary);
            margin-bottom: 10px;
            user-select: none;
            transition: color 0.4s;
        }
        .search-container { position: relative; width: 100%; margin-bottom: 30px; }
        .search-bar {
            width: 100%; padding: 20px 24px 20px 64px;
            font-size: 1.1rem; font-family: var(--font-ui);
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 32px; background: transparent;
            color: var(--md-sys-color-on-surface); outline: none;
            transition: all 0.3s;
        }
        .search-bar:focus {
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .search-icon {
            position: absolute; left: 24px; top: 50%;
            transform: translateY(-50%);
            color: var(--md-sys-color-primary);
        }
        .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .home-btn {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border: none; padding: 12px 28px; border-radius: 100px;
            cursor: pointer; font-family: var(--font-ui); font-weight: 600; font-size: 15px;
            transition: transform 0.1s, opacity 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .home-btn:active { transform: scale(0.95); }
        .home-btn:hover { opacity: 0.85; }
        .home-btn-primary {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }
        .home-btn-youtube { background: #FF0000; color: #FFFFFF; }
        .home-btn-youtube:hover { opacity: 0.88; }

        footer {
            position: absolute; bottom: 20px;
            font-size: 0.85rem; opacity: 0.7;
            text-align: center; min-height: 24px;
            transition: opacity 0.6s ease-in-out;
        }

        /* APPS PANEL */
        .apps-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center; z-index: 200;
        }
        .apps-panel {
            background: var(--md-sys-color-surface);
            padding: 24px; border-radius: 28px;
            width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; gap: 8px;
        }
        .apps-panel h2 { margin: 0 0 8px 0; font-weight: 600; }
        .app-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px; border-radius: 16px;
            cursor: pointer; transition: background 0.2s; font-weight: 500;
        }
        .app-item:hover { background: var(--md-sys-color-primary-container); }
        .app-icon {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--md-sys-color-primary-container);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
        }
        .apps-close-btn {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border: none; padding: 12px; border-radius: 100px;
            cursor: pointer; font-family: var(--font-ui); font-weight: 500;
            margin-top: 8px; width: 100%;
        }

        /* SUNLIT PAGE */
        #sunlit-page { width: 100%; height: 100vh; }
        #sunlit-page iframe { width: 100%; height: 100%; border: none; display: block; }
        .sunlit-back {
            position: fixed; top: 12px; left: 12px; z-index: 9999;
            background: rgba(0,0,0,0.65); color: #fff;
            border: none; padding: 8px 18px; border-radius: 100px;
            cursor: pointer; font-size: 14px; font-weight: 500;
            backdrop-filter: blur(8px); transition: background 0.2s;
        }

        /* YOUTUBE EXPLORER PAGE */
        #youtube-page.active { display: flex; }
        #youtube-page { min-height: 100vh; flex-direction: column; }

        .yt-topbar {
            display: flex; align-items: center; gap: 0;
            background: var(--md-sys-color-surface);
            border-bottom: 1px solid var(--yt-border2);
            padding: 0 24px;
            height: 64px;
            position: sticky; top: 0; z-index: 40;
            flex-shrink: 0;
        }
        .yt-topbar-menu {
            background: none; border: none;
            color: var(--md-sys-color-on-surface);
            cursor: pointer;
            width: 40px; height: 40px; border-radius: 50%;
