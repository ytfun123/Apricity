<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Eaglercraft Embedder</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #03dac6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(100deg); }
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="status-text">Fetching application data...</div>
    </div>

    <iframe id="game-frame" sandbox="allow-scripts allow-same-origin allow-pointer-lock font-src *"></iframe>

    <script>
        async function fetchAndEmbed() {
            const url = 'https://freezenova.com/db2/2026/unity/velocity-rush/pre.html';
            const statusText = document.getElementById('status-text');
            const iframe = document.getElementById('game-frame');
            const overlay = document.getElementById('loading-overlay');

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                statusText.textContent = "Processing and injecting code...";
                const sourceCode = await response.text();

                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                
                iframeDoc.open();
                iframeDoc.write(sourceCode);
                iframeDoc.close();

                iframe.style.display = "block";
                overlay.remove();

            } catch (error) {
                statusText.innerHTML = `<span style="color: #ff3333;">Failed to load data: ${error.message}</span>`;
                console.error('Embedding error:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', fetchAndEmbed);
    </script>

</body>
</html>
