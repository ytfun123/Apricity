      const response = await fetch('./assets/splashes.json', { cache: 'no-cache' });
      if (response.ok) {
        const list = await response.json();
        if (Array.isArray(list) && list.length) this.splashes = list;
      }
    } catch (err) {
      console.warn('splashes.json unavailable', err);
    }

    this.applyScale();
    this.applyLabels();
    this.renderSplash();
    this.renderOptions();
    this.renderWorlds(this.handlers.getWorlds?.() ?? []);
    this.renderServers(this.handlers.getServers?.() ?? []);
  }

  wire() {
    const on = (id, fn) => $(id)?.addEventListener('click', fn);
    on('btn-singleplayer', () => this.handlers.onSingleplayer?.());
    on('btn-multiplayer', () => this.handlers.onMultiplayer?.());
    on('btn-options', () => this.handlers.onOpenOptions?.());
    on('btn-quit-game', () => this.handlers.onQuitGame?.());
    on('btn-back-title', () => this.handlers.onBackToTitle?.());
    on('btn-back-title-servers', () => this.handlers.onBackToTitle?.());

    on('btn-create-world', () => {
      this.handlers.onCreateWorld?.($('new-world-name').value, $('new-world-seed').value);
      $('new-world-name').value = '';
      $('new-world-seed').value = '';
    });
    on('btn-play-world', () => {
      if (this.selectedWorld) this.handlers.onPlayWorld?.(this.selectedWorld);
    });
    on('btn-delete-world', () => {
      if (!this.selectedWorld) return;
      this.handlers.onDeleteWorld?.(this.selectedWorld);
      this.selectedWorld = null;
    });

    on('btn-join-server', () => {
      if (this.selectedServer) this.handlers.onJoinServer?.(this.selectedServer);
    });
    on('btn-delete-server', () => {
      if (!this.selectedServer) return;
      this.handlers.onDeleteServer?.(this.selectedServer);
      this.selectedServer = null;
      this.renderServers(this.handlers.getServers?.() ?? []);
    });
    on('btn-refresh-servers', () => this.renderServers(this.handlers.getServers?.() ?? []));
    on('btn-add-server', () => {
      this.handlers.onAddServer?.($('server-name').value, $('server-address').value);
      $('server-name').value = '';
    });
    on('btn-direct-connect', () => {
      const address = $('server-address').value.trim() || this.selectedServer?.address || '';
      if (address) this.handlers.onJoinServer?.({ id: 'direct', name: address, address });
    });

    on('btn-options-done', () => this.handlers.onBackFromOptions?.());
    on('btn-resume', () => this.handlers.onResume?.());
    on('btn-pause-options', () => this.handlers.onOpenOptions?.());
    on('btn-quit', () => this.handlers.onQuit?.());
    on('btn-cancel-connect', () => this.handlers.onCancelConnect?.());
    on('btn-open-creative', () => this.handlers.onOpenCreative?.());

    // The inventory closes when the world behind the panel is clicked.
    this.screens.inventory?.addEventListener('click', (event) => {
      if (event.target === this.screens.inventory) this.handlers.onCloseInventory?.();
    });
  }

  /** Write every static label in the pack's font. */
  applyLabels() {
    const s = this.strings;
    const put = (id, text, scale) => {
      const el = $(id);
      if (el) setText(el, text, scale ? { scale } : {});
    };
    put('btn-singleplayer', s.singleplayer);
    put('btn-multiplayer', s.multiplayer);
    put('btn-realms', s.realms);
    put('btn-options', s.options);
    put('btn-quit-game', s.quit);
    put('worlds-title', s.selectWorld);
    put('label-world-name', s.worldName);
    put('label-world-seed', s.worldSeed);
    put('btn-play-world', s.playSelected);
    put('btn-create-world', s.createWorld);
    put('btn-edit-world', s.edit);
    put('btn-delete-world', s.delete);
    put('btn-recreate-world', s.recreate);
    put('btn-back-title', s.cancel);
    put('servers-title', s.playMultiplayer);
    put('label-nickname', s.playerName);
    put('label-server-name', s.serverName);
    put('label-server-address', s.serverAddress);
    put('btn-join-server', s.joinServer);
    put('btn-direct-connect', s.directConnect);
    put('btn-add-server', s.addServer);
    put('btn-edit-server', s.edit);
    put('btn-delete-server', s.delete);
    put('btn-refresh-servers', s.refresh);
    put('btn-back-title-servers', s.cancel);
    put('options-title', s.optionsTitle);
    put('btn-options-done', s.done);
    put('pause-title', s.gameMenu);
    put('btn-resume', s.backToGame);
    put('btn-advancements', s.advancements);
    put('btn-statistics', s.statistics);
    put('btn-pause-options', s.options);
    put('btn-quit', s.saveQuit);
    put('pause-footer', 'Minecraft 1.12.2', 1);
    put('btn-cancel-connect', s.cancel);
    put('inventory-title', s.inventory);
    put('btn-open-creative', s.creative);
    put('click-to-play', s.clickToPlay);
    put('title-bottom-left', 'Minecraft 1.12.2', 1);
    put('title-bottom-right', 'Not affiliated with Mojang or Microsoft', 1);
    if (this.debugLines.length) this.setDebug(this.lastDebug ?? '');
    put('connect-title', this.connectTitle?.dataset.text || s.connecting);
    if (this.splashEl && this.splashText) put('splash', this.splashText);
    this.syncListButtons();
  }

  /** The tilted yellow splash under the logo, as the title screen shows it. */
  renderSplash() {
    if (!this.splashEl) return;
    if (!this.splashText) {
      const pool = this.splashes;
      this.splashText = pool[Math.floor(Math.random() * pool.length)] ?? 'Eagler!';
    }
    setText(this.splashEl, this.splashText, { scale: this.scale });
  }

  /** 1.12.2's Auto scale: the biggest of 1..3 whose 320x240 layout fits. */
  autoScale() {
    const fit = Math.min(window.innerWidth / 320, window.innerHeight / 240);
    return Math.max(1, Math.min(3, Math.floor(fit)));
  }

  /** Store the chosen scale (0 = Auto) and relayout the whole interface. */
  setGuiScale(scale) {
    this.options.guiScale = scale;
    this.applyScale();
    this.applyLabels();
    this.renderSplash();
    this.renderOptions();
    this.renderWorlds(this.worlds);
    this.renderServers(this.servers);
    this.renderCreativeHotbar();
    this.setDebug(this.lastDebug ?? '');
    this.setConnectStatus(this.lastStatus ?? '');
  }

  /** Recompute the effective scale; the window resize handler calls this too. */
  applyScale() {
    const chosen = this.options.guiScale;
    this.scale = chosen > 0 ? chosen : this.autoScale();
    document.documentElement.style.setProperty('--gui', String(this.scale));
    setBaseScale(this.scale);
    for (const line of [...this.chatEl.children]) setText(line, line.dataset.text ?? '', { scale: this.scale });
    // Block icons are positioned in pixels from the old scale, so redraw them.
    if (this.sessionHotbar) this.setHotbar(this.sessionHotbar.ids, this.sessionHotbar.selected);
    return this.scale;
  }

  setOptions(options) {
    this.options = { ...this.options, ...options };
    this.setGuiScale(this.options.guiScale);
  }

  renderOptions() {
    if (!this.optionsMenu) return;
    this.optionsMenu.textContent = '';
    for (const row of OPTION_ROWS) {
      const slider = document.createElement('button');
      slider.className = 'mc-slider';
      const label = document.createElement('span');
      label.className = 'mc-text';
      const knob = document.createElement('div');
      knob.className = 'knob';
      slider.append(label, knob);

      const value = this.options[row.key];
      const index = Math.max(0, row.values.indexOf(value));
      const fraction = index / (row.values.length - 1);
      knob.style.left = `calc(${(fraction * 192).toFixed(1)}px * var(--gui))`;
      const shown = row.key === 'guiScale' && value === 0 ? 'Auto' : `${value}${row.suffix}`;
      setText(label, `${this.strings[row.label] ?? row.label}: ${shown}`);

      const setFromPointer = (event) => {
        const rect = slider.getBoundingClientRect();
        if (!rect.width) return;
        const t = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
        const value = row.values[Math.round(t * (row.values.length - 1))];
        if (value === this.options[row.key]) return;
        this.options[row.key] = value;
        this.handlers.onOptionsChanged?.({ [row.key]: value });
        if (row.key === 'guiScale') this.setGuiScale(value);
        else this.renderOptions();
      };

      slider.addEventListener('pointerdown', (event) => {
        slider.setPointerCapture?.(event.pointerId);
        this.draggingSlider = slider;
        setFromPointer(event);
      });
      slider.addEventListener('pointermove', (event) => {
        if (this.draggingSlider === slider) setFromPointer(event);
      });
      slider.addEventListener('pointerup', () => { this.draggingSlider = null; });
      slider.addEventListener('pointercancel', () => { this.draggingSlider = null; });

      this.optionsMenu.appendChild(slider);
    }
  }

  /* ── screens ─────────────────────────────────────────────────────────── */

  showScreen(name) {
    for (const [key, element] of Object.entries(this.screens)) {
      element.classList.toggle('active', key === name);
    }
    // The HUD stays visible behind the container screens, as in game.
    this.hud.classList.toggle('visible', name === null || name === 'inventory' || name === 'creative');
    this.setClickToPlay(name === null);
  }

  isInventoryOpen() {
    return (
      (this.screens.inventory?.classList.contains('active') ?? false) ||
      (this.screens.creative?.classList.contains('active') ?? false)
    );
  }

  anyScreenOpen() {
    return Object.values(this.screens).some((element) => element.classList.contains('active'));
  }

  showQuitNotice() {
    this.showScreen('title');
    for (const id of ['btn-singleplayer', 'btn-multiplayer', 'btn-realms', 'btn-options', 'btn-quit-game']) {
      const button = $(id);
      if (button) button.style.display = 'none';
    }
    if (!this.quitNotice) {
      this.quitNotice = document.createElement('div');
      this.quitNotice.className = 'mc-text';
      this.quitNotice.style.marginTop = '24px';
      this.screens.title.appendChild(this.quitNotice);
    }
    setText(this.quitNotice, 'Thanks for playing - reload the page to start again.');
  }

  setAssetWarning(text) {
    if (!this.assetWarning) return;
    setText(this.assetWarning, text || '');
    this.assetWarning.classList.toggle('visible', Boolean(text));
  }

  /* ── selection lists (1.12.2 selects a row, then a button acts on it) ── */

  syncListButtons() {
    const world = this.selectedWorld;
    const server = this.selectedServer;
    if ($('btn-play-world')) $('btn-play-world').disabled = !world;
    if ($('btn-delete-world')) $('btn-delete-world').disabled = !world;
    if ($('btn-join-server')) $('btn-join-server').disabled = !server;
    if ($('btn-delete-server')) $('btn-delete-server').disabled = !server;
  }

  renderWorlds(worlds) {
    this.worlds = worlds;
    const list = $('world-list');
    if (!list) return;
    list.textContent = '';
    this.selectedWorld = null;

    if (!worlds.length) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      setText(empty, 'No worlds yet - create one below.');
      list.appendChild(empty);
      this.syncListButtons();
      return;
    }

    for (const world of worlds) {
      const item = document.createElement('li');
      const meta = document.createElement('div');
      meta.className = 'meta';
      const name = textElement(world.name, { scale: this.options.guiScale });
      const detail = textElement(
        `${world.edits?.length ?? 0} blocks changed${
          world.lastPlayed ? ` - ${new Date(world.lastPlayed).toLocaleDateString()}` : ''
        }`,
        { scale: Math.max(1, this.options.guiScale - 1) }
      );
      meta.append(name, detail);
      item.appendChild(meta);

      const select = () => {
        this.selectedWorld = world;
        for (const row of list.children) row.classList.toggle('selected', row === item);
        this.syncListButtons();
      };
      item.addEventListener('click', select);
      item.addEventListener('dblclick', () => this.handlers.onPlayWorld?.(world));
      list.appendChild(item);
    }
    this.syncListButtons();
  }

  renderServers(servers) {
    this.servers = servers;
    const list = $('server-list');
    if (!list) return;
    list.textContent = '';
    this.selectedServer = null;

    if (!servers.length) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      setText(empty, 'No servers yet - add one below.');
      list.appendChild(empty);
      this.syncListButtons();
      return;
    }

    for (const server of servers) {
      const item = document.createElement('li');
      const meta = document.createElement('div');
      meta.className = 'meta';
      const name = textElement(server.name, { scale: this.options.guiScale });
      const detail = textElement(server.address, { scale: Math.max(1, this.options.guiScale - 1) });
      meta.append(name, detail);
      item.appendChild(meta);

      const select = () => {
        this.selectedServer = server;
        for (const row of list.children) row.classList.toggle('selected', row === item);
        this.syncListButtons();
      };
      item.addEventListener('click', select);
      item.addEventListener('dblclick', () => this.handlers.onJoinServer?.(server));
      list.appendChild(item);
    }
    this.syncListButtons();
  }

  getNickname() {
    return $('nickname').value.trim() || 'Player';
  }

  /* ── connect log ─────────────────────────────────────────────────────── */

  setConnectTitle(text) {
    if (!this.connectTitle) return;
    this.connectTitle.dataset.text = text;
    setText(this.connectTitle, text);
  }

  setConnectStatus(text) {
    this.lastStatus = text;
    if (this.connectStatus) setText(this.connectStatus, text);
  }

  clearConnectLog() {
    if (this.connectLog) this.connectLog.textContent = '';
  }

  log(line) {
    if (!this.connectLog) return;
    const stamp = new Date().toLocaleTimeString([], { hour12: false });
    const row = textElement(`${stamp}  ${line}`, { scale: 1 });
    this.connectLog.appendChild(row);
    this.connectLog.scrollTop = this.connectLog.scrollHeight;
  }

  /* ── chat / debug ────────────────────────────────────────────────────── */

  appendChat(text) {
    const line = textElement(text, { scale: this.options.guiScale });
    line.dataset.text = text;
    this.chatEl.appendChild(line);
    while (this.chatEl.childElementCount > 10) this.chatEl.firstElementChild.remove();
  }

  clearChat() {
    this.chatEl.textContent = '';
  }

  setDebug(text) {
    this.lastDebug = text;
    if (!this.debugEl) return;
    const lines = String(text).split('\n');
    while (this.debugLines.length < lines.length) {
      const row = document.createElement('div');
      row.className = 'mc-text';
      this.debugEl.appendChild(row);
      this.debugLines.push(row);
    }
    for (let i = 0; i < lines.length; i++) setText(this.debugLines[i], lines[i], { scale: 1 });
    while (this.debugLines.length > lines.length) this.debugLines.pop().remove();
  }

  /* ── HUD ─────────────────────────────────────────────────────────────── */

  iconStyle(el, id) {
    const atlas = getAtlas();
    const tile = atlas ? tileFor(id, 'side') : null;
    if (!atlas || !tile) return;
    // The resolved scale, not the raw setting: 0 means Auto.
    const scale = this.scale || 1;
    el.style.backgroundImage = "url('" + __assetURI("atlas.png") + "')";
    el.style.backgroundSize = `${atlas.width * scale}px ${atlas.height * scale}px`;
    el.style.backgroundPosition = `-${tile[0] * atlas.tileSize * scale}px -${tile[1] * atlas.tileSize * scale}px`;
  }

  setHotbar(ids, selected) {
    this.sessionHotbar = { ids, selected };
    this.hotbarEl.textContent = '';
    ids.forEach((id, index) => {
      const slot = document.createElement('div');
      slot.className = `slot${index === selected ? ' active' : ''}`;
      const icon = document.createElement('div');
      icon.className = 'icon';
      this.iconStyle(icon, id);
      icon.title = blockName(id);
      slot.append(icon);
      slot.addEventListener('click', () => this.handlers.onSelectSlot?.(index));
      this.hotbarEl.appendChild(slot);
    });
    this.renderBars();
    this.renderInventory();
    this.renderCreativeHotbar();
  }

  renderBars() {
    // No damage or hunger system yet, so the bars show a full, unspoiled player:
    // a 9x9 frame from icons.png with the full sprite laid over it.
    if (this.heartsEl && !this.heartsEl.childElementCount) {
      for (let i = 0; i < 10; i++) {
        const heart = document.createElement('div');
        heart.className = 'hud-icon heart';
        heart.appendChild(document.createElement('i'));
        this.heartsEl.appendChild(heart);
      }
    }
    if (this.hungerEl && !this.hungerEl.childElementCount) {
      for (let i = 0; i < 10; i++) {
        const food = document.createElement('div');
        food.className = 'hud-icon food';
        food.appendChild(document.createElement('i'));
        this.hungerEl.appendChild(food);
      }
    }
    if (this.xpFill) this.xpFill.style.width = '0%';
  }

  showInventory(ids, selected) {
    this.sessionHotbar = { ids, selected };
    this.renderInventory();
    this.showScreen('inventory');
  }

  /** The creative palette: every block, one click to the selected hotbar slot. */
  buildCreative() {
    if (this.creativeBuilt) return;
    const grid = $('creative-grid');
    if (!grid) return;
    for (const id of BLOCKS.keys()) {
      if (!id) continue;
      const button = document.createElement('button');
      button.className = 'block';
      const icon = document.createElement('div');
      icon.className = 'icon';
      this.iconStyle(icon, id);
      icon.title = blockName(id);
      button.append(icon);
      button.addEventListener('click', () => this.handlers.onPickBlock?.(id));
      grid.appendChild(button);
    }
    this.creativeBuilt = true;
  }

  showCreative(ids, selected) {
    this.buildCreative();
    this.sessionHotbar = { ids, selected };
    this.renderCreativeHotbar();
    this.showScreen('creative');
  }

  renderCreativeHotbar() {
    const bar = $('creative-hotbar');
    if (!bar || !this.sessionHotbar) return;
    const { ids, selected } = this.sessionHotbar;
    bar.textContent = '';
    ids.forEach((id, index) => {
      const slot = document.createElement('div');
      slot.className = `inv-slot${index === selected ? ' active' : ''}`;
      const icon = document.createElement('div');
      icon.className = 'icon';
      this.iconStyle(icon, id);
      slot.append(icon);
      slot.addEventListener('click', () => this.handlers.onSelectSlot?.(index));
      bar.appendChild(slot);
    });
  }

  /** Toast notification in the pack's own frame. */
  toast(message) {
    const container = $('toasts');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.appendChild(textElement(message, { scale: Math.max(1, this.options.guiScale - 1) }));
    container.appendChild(toast);
    while (container.childElementCount > 4) container.firstElementChild.remove();
    setTimeout(() => toast.remove(), 3200);
  }

  renderInventory() {
    if (!this.inventoryHotbar || !this.sessionHotbar) return;
    const { ids, selected } = this.sessionHotbar;
    this.inventoryHotbar.textContent = '';
    ids.forEach((id, index) => {
      const slot = document.createElement('div');
      slot.className = `inv-slot${index === selected ? ' active' : ''}`;
      const icon = document.createElement('div');
      icon.className = 'icon';
      this.iconStyle(icon, id);
      slot.append(icon);
      slot.addEventListener('click', () => this.handlers.onSelectSlot?.(index));
      this.inventoryHotbar.appendChild(slot);
    });
  }

  setClickToPlay(visible) {
    this.clickToPlay.classList.toggle('visible', Boolean(visible));
  }

  openChat() {
    this.chatInput.classList.add('open');
    this.chatInput.focus();
  }

  closeChat() {
    this.chatInput.classList.remove('open');
    this.chatInput.blur();
  }

  isChatOpen() {
    return this.chatInput.classList.contains('open');
  }

  measure(text) {
    return measureText(text);
  }
}

// ── js/main.js ─────────────────────────────────────────────────
// App bootstrap: screens, world management, input, the render loop, and the
// multiplayer session.


const WORLDS_KEY = 'apricity-eagler.worlds';
const SERVERS_KEY = 'apricity-eagler.servers';
const OPTIONS_KEY = 'apricity-eagler.options';
const DEFAULT_OPTIONS = { renderDistance: 4, fov: 75, sensitivity: 100, guiScale: 0 };

const DEFAULT_SERVERS = [
  { id: 'arch', name: 'ArchMC', address: 'mc.arch.lol' },
  { id: 'clever', name: 'Clever Teaching', address: 'wss://clever-teaching.com/' },
];

const canvas = document.getElementById('game');
const renderer = new Renderer(canvas);

const state = {
  mode: null,
  world: null,
  worldRecord: null,
  player: null,
  session: null,
  selectedSlot: 0,
  hotbar: [...HOTBAR],
  teleported: false,
  chunksDone: 0,
  fps: 0,
  lastPositionSent: 0,
  lastChunkScan: 0,
  chatLines: [],
};

const keys = new Set();
const input = { forward: false, back: false, left: false, right: false, jump: false, sprint: false, up: false, down: false };

// ── storage ────────────────────────────────────────────────────────────────

function readJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function writeJson(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {
    console.warn('could not save', key, err);
  }
}

const loadWorlds = () => readJson(WORLDS_KEY, []);
const saveWorlds = (list) => writeJson(WORLDS_KEY, list);
const loadServers = () => {
  const stored = readJson(SERVERS_KEY, null);
  if (stored) return stored;
  writeJson(SERVERS_KEY, DEFAULT_SERVERS);
  return DEFAULT_SERVERS;
};
const saveServers = (list) => writeJson(SERVERS_KEY, list);
const loadOptions = () => ({ ...DEFAULT_OPTIONS, ...readJson(OPTIONS_KEY, {}) });
const saveOptions = (options) => writeJson(OPTIONS_KEY, options);
const options = loadOptions();

function newId() {
  return Math.random().toString(36).slice(2, 10);
}

// ── mesh queue ─────────────────────────────────────────────────────────────

const meshQueue = [];
const queued = new Set();

function queueMesh(cx, cz, force = false) {
  const key = chunkKey(cx, cz);
  if (!force && renderer.buffers.has(key)) return;
  if (queued.has(key)) return;
  queued.add(key);
  meshQueue.push({ cx, cz, key });
}

function processMeshQueue(budgetMs = 8) {
  if (!state.world) return;
  const start = performance.now();
  while (meshQueue.length && performance.now() - start < budgetMs) {
    const job = meshQueue.shift();
    queued.delete(job.key);
    try {
      if (!state.world.hasChunk(job.cx, job.cz)) {
        // Singleplayer generates on demand (generation stays inside the budget so
        // it never blocks a frame); a server world only gets chunks from the server.
        if (state.mode !== 'single') continue;
        state.world.getChunk(job.cx, job.cz);
      }
      renderer.upload(job.key, buildMesh(state.world, job.cx, job.cz));
      state.chunksDone++;
    } catch (err) {
      console.warn('mesh failed', job.key, err);
    }
  }
}

function clearChunks() {
  for (const key of [...renderer.buffers.keys()]) renderer.remove(key);
  meshQueue.length = 0;
  queued.clear();
}

function scanAroundPlayer(radius) {
  if (!state.player || !state.world) return;
  const pcx = Math.floor(state.player.x / 16);
  const pcz = Math.floor(state.player.z / 16);
  for (let dx = -radius; dx <= radius; dx++) {
    for (let dz = -radius; dz <= radius; dz++) {
      const cx = pcx + dx;
      const cz = pcz + dz;
      // Generation happens in the mesh queue, inside its per-frame budget.
      queueMesh(cx, cz);
    }
  }
}

// ── UI ─────────────────────────────────────────────────────────────────────

const ui = new UI({
  onSingleplayer: () => {
    ui.renderWorlds(loadWorlds());
    ui.showScreen('worlds');
  },
  onMultiplayer: () => {
    ui.renderServers(loadServers());
    ui.showScreen('servers');
  },
  onBackToTitle: () => ui.showScreen('title'),
  onCreateWorld: (name, seed) => {
    const worlds = loadWorlds();
    const record = {
      id: newId(),
      name: name.trim() || `World ${worlds.length + 1}`,
      seed: seed.trim() ? hashSeed(seed.trim()) : Math.floor(Math.random() * 1e9),
      edits: [],
      lastPlayed: null,
    };
    worlds.push(record);
    saveWorlds(worlds);
    ui.renderWorlds(worlds);
    playWorld(record);
  },
  onPlayWorld: (record) => playWorld(record),
  onDeleteWorld: (record) => {
    const worlds = loadWorlds().filter((w) => w.id !== record.id);
    saveWorlds(worlds);
    ui.renderWorlds(worlds);
  },
  onAddServer: (name, address) => {
    if (!address.trim()) return;
    const servers = loadServers();
    servers.push({ id: newId(), name: name.trim() || address.trim(), address: address.trim() });
    saveServers(servers);
    ui.renderServers(servers);
  },
  onJoinServer: (server) => joinServer(server),
  onDeleteServer: (server) => {
    const servers = loadServers().filter((s) => s.id !== server.id);
    saveServers(servers);
    ui.renderServers(servers);
  },
  onResume: () => resumeGame(),
  onQuit: () => quitToTitle(),
  onCancelConnect: () => {
    // Also covers the kicked case: drop the session and reset back to the title.
    stopSession();
    quitToTitle();
  },
  onSendChat: (text) => state.session?.sendChat(text),
  onSelectSlot: (index) => selectSlot(index),
  getWorlds: () => loadWorlds(),
  getServers: () => loadServers(),
  onOpenOptions: () => ui.showScreen('options'),
  onBackFromOptions: () => ui.showScreen(state.mode ? 'pause' : 'title'),
  onOptionsChanged: (next) => {
    Object.assign(options, next);
    saveOptions(options);
    applyOptions();
  },
  onCloseInventory: () => resumeGame(),
  onOpenCreative: () => openCreative(),
  onPickBlock: (id) => {
    state.hotbar[state.selectedSlot] = id;
    selectSlot(state.selectedSlot);
    ui.toast(`Picked ${blockName(id)}`);
  },
  onQuitGame: () => {
    stopSession();
    document.exitPointerLock?.();
    state.mode = null;
    state.world = null;
    state.player = null;
    state.worldRecord = null;
    clearChunks();
    ui.showQuitNotice();
  },
});

function hashSeed(text) {
  let hash = 0;
  for (let i = 0; i < text.length; i++) hash = (Math.imul(hash, 31) + text.charCodeAt(i)) | 0;
  return Math.abs(hash) || 1;
}

function selectSlot(index) {
  state.selectedSlot = Math.max(0, Math.min(state.hotbar.length - 1, index));
  ui.setHotbar(state.hotbar, state.selectedSlot);
}

/** Push the saved options into the page and the renderer. */
function applyOptions() {
  ui.setOptions(options);
}

function openInventory() {
  if (!state.mode) return;
  document.exitPointerLock?.();
  ui.showInventory(state.hotbar, state.selectedSlot);
}

function openCreative() {
  if (!state.mode) return;
  document.exitPointerLock?.();
  ui.showCreative(state.hotbar, state.selectedSlot);
}

// ── game entry ─────────────────────────────────────────────────────────────

function stopSession() {
  if (state.session) {
    try {
      state.session.disconnect();
    } catch {
      /* already gone */
    }
    state.session = null;
  }
}

function playWorld(record) {
  stopSession();
  clearChunks();

  const world = new World({ seed: record.seed, edits: record.edits || [] });
  const player = new Player(world);
  const spawn = world.findSpawn();
  player.spawnAt(spawn.x, spawn.z);

  state.mode = 'single';
  state.world = world;
  state.worldRecord = record;
  state.player = player;
  state.teleported = true;
  state.chunksDone = 0;

  record.lastPlayed = Date.now();
  const worlds = loadWorlds().map((w) => (w.id === record.id ? record : w));
  saveWorlds(worlds);

  scanAroundPlayer(options.renderDistance);
  for (const key of world.takeDirty()) {
    const [cx, cz] = key.split(',').map(Number);
    if (world.hasChunk(cx, cz)) queueMesh(cx, cz, true);
  }

  ui.showScreen(null);
  ui.clearChat();
  selectSlot(0);
  resize();
  canvas.focus();
}

function joinServer(server) {
  stopSession();
  clearChunks();
  ui.clearConnectLog();
  ui.setConnectTitle(`Joining ${server.name}`);
  ui.setConnectStatus('opening socket');
  ui.showScreen('connect');

  const world = new World({ generate: false });
  const player = new Player(world);
  player.flying = true; // until the server sends our position

  state.mode = 'multi';
  state.world = world;
  state.player = player;
  state.teleported = false;
  state.chunksDone = 0;

  const session = new MultiplayerSession({
    address: server.address,
    username: ui.getNickname(),
    world,
    handlers: {
      onLog: (line) => ui.log(line),
      onStatus: (text) => ui.setConnectStatus(text),
      onChat: (text) => ui.appendChat(text),
      onChunk: (cx, cz) => queueMesh(cx, cz, true),
      onBlockChange: (x, y, z) => queueMesh(x >> 4, z >> 4, true),
      onJoin: () => {
        ui.setConnectStatus('in game');
        ui.toast(`Joined ${server.name}`);
        ui.showScreen(null);
        ui.clearChat();
        selectSlot(0);
        resize();
        canvas.focus();
      },
      onTeleport: ({ x, y, z, yaw, pitch }) => {
        player.x = x;
        player.y = y;
        player.z = z;
        if (!state.teleported) {
          player.yaw = (yaw * Math.PI) / 180;
          player.pitch = (pitch * Math.PI) / 180;
          player.flying = false;
          state.teleported = true;
          if (state.mode === 'multi') ui.showScreen(null);
        }
      },
      onKick: (reason) => {
        state.session = null;
        ui.setConnectTitle('Disconnected');
        ui.setConnectStatus(reason);
        ui.log(reason);
        ui.showScreen('connect');
      },
    },
  });

  state.session = session;
  session.connect();
}

function requestLock() {
  try {
    const result = canvas.requestPointerLock?.();
    // Chrome returns a promise that rejects when the page is not focused yet.
    if (result && typeof result.catch === 'function') result.catch(() => {});
  } catch {
    /* pointer lock is a nicety, never fatal */
  }
}

function pauseGame() {
  if (!state.mode) return;
  document.exitPointerLock?.();
  if (ui.isChatOpen()) ui.closeChat();
  ui.showScreen('pause');
}

function resumeGame() {
  if (!state.mode) return;
  ui.showScreen(null);
  requestLock();
}

function quitToTitle() {
  if (state.mode === 'single' && state.world && state.worldRecord) {
    const record = state.worldRecord;
    record.edits = state.world.serializeEdits();
    const worlds = loadWorlds().map((w) => (w.id === record.id ? record : w));
    saveWorlds(worlds);
    ui.toast('World saved');
  }
  stopSession();
  document.exitPointerLock?.();
  state.mode = null;
  state.world = null;
  state.player = null;
  state.worldRecord = null;
  clearChunks();
  ui.showScreen('title');
}

// ── input ──────────────────────────────────────────────────────────────────

const KEY_MAP = {
  KeyW: 'forward',
  ArrowUp: 'forward',
  KeyS: 'back',
  ArrowDown: 'back',
  KeyA: 'left',
  ArrowLeft: 'left',
  KeyD: 'right',
  ArrowRight: 'right',
  Space: 'jump',
  ShiftLeft: 'sprint',
  ShiftRight: 'sprint',
  KeyQ: 'down',
  KeyE: 'up',
};

function syncInput() {
  for (const [prop] of Object.entries(input)) input[prop] = false;
  for (const code of keys) {
    const mapped = KEY_MAP[code];
    if (mapped) input[mapped] = true;
  }
}

window.addEventListener('keydown', (event) => {
  if (ui.isChatOpen()) return;
  if (!state.mode) return;

  if (event.code === 'Escape') {
    if (ui.isInventoryOpen()) resumeGame();
    else pauseGame();
    return;
  }
  if (event.code === 'KeyE' && !state.player?.flying) {
    event.preventDefault();
    openInventory();
    return;
  }
  // With the inventory up the game is still rendered but you do not walk.
  if (ui.isInventoryOpen()) return;
  if (event.code === 'KeyT') {
    ui.openChat();
    event.preventDefault();
    return;
  }
  if (event.code === 'KeyF' && state.mode === 'single') {
    state.player.flying = !state.player.flying;
    state.player.vy = 0;
    return;
  }
  if (event.code.startsWith('Digit')) {
    const index = Number(event.code.slice(5)) - 1;
    if (index >= 0 && index < HOTBAR.length) selectSlot(index);
    return;
  }

  if (KEY_MAP[event.code]) {
    keys.add(event.code);
    syncInput();
    if (event.code === 'Space') event.preventDefault();
  }
});

window.addEventListener('keyup', (event) => {
  keys.delete(event.code);
  syncInput();
});

window.addEventListener('blur', () => {
  keys.clear();
  syncInput();
});

canvas.addEventListener('mousedown', (event) => {
  if (!state.player) return;
  if (document.pointerLockElement !== canvas) {
    requestLock();
    ui.setClickToPlay(false);
    return;
  }
  if (state.mode !== 'single') return;

  const hit = state.player.raycast(6);
  if (!hit) return;

  if (event.button === 0) {
    state.world.setBlock(hit.x, hit.y, hit.z, 0);
  } else if (event.button === 2) {
    const bx = hit.x + hit.face[0];
    const by = hit.y + hit.face[1];
    const bz = hit.z + hit.face[2];
    if (!state.player.intersectsBlock(bx, by, bz)) {
      state.world.setBlock(bx, by, bz, state.hotbar[state.selectedSlot]);
    }
  }
});

canvas.addEventListener('contextmenu', (event) => event.preventDefault());

canvas.addEventListener('wheel', (event) => {
  if (!state.mode) return;
  event.preventDefault();
  const dir = event.deltaY > 0 ? 1 : -1;
  selectSlot((state.selectedSlot + dir + HOTBAR.length) % HOTBAR.length);
}, { passive: false });

document.addEventListener('mousemove', (event) => {
  if (document.pointerLockElement !== canvas || !state.player) return;
  const sensitivity = 0.0022 * (options.sensitivity / 100);
  state.player.yaw -= event.movementX * sensitivity;
  state.player.pitch -= event.movementY * sensitivity;
  const limit = Math.PI / 2 - 0.01;
  state.player.pitch = Math.max(-limit, Math.min(limit, state.player.pitch));
});

document.addEventListener('pointerlockchange', () => {
  if (!state.mode) return;
  const locked = document.pointerLockElement === canvas;
  if (locked) {
    ui.setClickToPlay(false);
    return;
  }
  // Escape (or a tab switch) drops pointer lock: treat that as pausing unless a
  // screen is already up.
  if (!ui.anyScreenOpen()) {
    ui.setClickToPlay(true);
    pauseGame();
  }
});

// ── loop ───────────────────────────────────────────────────────────────────

function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  renderer.setSize(width, height);
  // Auto GUI scale follows the window, as 1.12.2 does on resize.
  ui?.applyScale?.();
}

window.addEventListener('resize', resize);

function updateHud(now) {
  if (!state.player) return;
  const p = state.player;
  const chunks = renderer.chunkCount;
  const mode = state.mode === 'multi' ? 'multiplayer' : 'singleplayer';
  const flight = p.flying ? ' · flying' : '';
  ui.setDebug(
    `${Math.round(state.fps)} fps\n` +
      `xyz ${p.x.toFixed(1)} ${p.y.toFixed(1)} ${p.z.toFixed(1)}\n` +
      `${mode}${flight}\n` +
      `chunks ${chunks} · ${Math.round(renderer.triangleCount / 1000)}k tris`
  );
}

let lastFrame = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  state.fps = state.fps * 0.9 + (1 / Math.max(dt, 0.0001)) * 0.1;

  if (state.mode && state.player) {
    state.player.update(dt, input);

    if (state.mode === 'multi' && state.session && now - state.lastPositionSent > 100) {
      state.lastPositionSent = now;
      const p = state.player;
      state.session.sendPosition(p.x, p.y, p.z, (p.yaw * 180) / Math.PI, (p.pitch * 180) / Math.PI, p.onGround);
    }

    if (now - state.lastChunkScan > 400) {
      state.lastChunkScan = now;
      scanAroundPlayer(state.mode === 'single' ? options.renderDistance : 9);
    }

    for (const key of state.world.takeDirty()) {
      const [cx, cz] = key.split(',').map(Number);
      if (state.world.hasChunk(cx, cz)) queueMesh(cx, cz, true);
    }
  }

  processMeshQueue();

  const width = window.innerWidth;
  const height = window.innerHeight;
  renderer.setSize(width, height);

  if (state.player) {
    const p = state.player;
    const selection = state.mode === 'single' ? p.raycast(6) : null;
    renderer.setSky(1);
    renderer.render(
      { x: p.x, y: p.eyeY(), z: p.z, yaw: p.yaw, pitch: p.pitch, fov: options.fov },
      width / Math.max(1, height),
      selection
    );
    updateHud(now);
  } else {
    renderer.setSky(1);
    renderer.render({ x: 0, y: 70, z: 0, yaw: 0.6, pitch: -0.15, fov: options.fov }, width / Math.max(1, height), null);
  }

  requestAnimationFrame(frame);
}

// ── boot ───────────────────────────────────────────────────────────────────

// Textures are built from the bundled Eaglercraft asset pack by
// tools/build-assets.mjs; if they are missing the client still runs, unfurnished.
async function loadAtlas() {
  try {
    const response = await fetch('./assets/atlas.json', { cache: 'no-cache' });
    if (!response.ok) throw new Error(`atlas.json ${response.status}`);
    const meta = await response.json();
    const image = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('atlas.png failed to load'));
      // Cache-bust: the atlas is rebuilt by tools/build-assets.mjs.
      img.src = __assetURI("atlas.png");
    });
    setAtlas(meta);
    renderer.setAtlasTexture(image);
    selectSlot(state.selectedSlot);
    ui.setAssetWarning('');
    // Anything meshed before the atlas arrived needs one redraw.
    if (state.mode) {
      clearChunks();
      scanAroundPlayer(state.mode === 'single' ? options.renderDistance : 9);
    }
    console.log(`atlas loaded: ${Object.keys(meta.tiles).length} tiles`);
  } catch (err) {
    ui.setAssetWarning(`Could not load textures (${err.message}) — run: node tools/build-assets.mjs`);
  }
}

resize();
applyOptions();
ui.init();
ui.showScreen('title');
ui.renderWorlds(loadWorlds());
ui.renderServers(loadServers());
selectSlot(0);
requestAnimationFrame(frame);
loadAtlas();

// Diagnostics handle for automated checks.
window.__eagler = { state, renderer, ui, playWorld, joinServer, quitToTitle };


})();
</script>
</body>
</html>
