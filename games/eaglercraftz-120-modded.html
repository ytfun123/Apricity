<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen iframe</title>
    <style>
        /* Remove default margins and padding */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
            background-color: #000000; /* Dark background while loading */
        }

        /* Make the iframe cover the entire screen */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- REPLACE THE URL IN THE src ATTRIBUTE WITH YOUR OWN LINK -->
    <iframe src="https://amplify-science-learning-ecz.pages.dev/javascript/builds/0.3.0/"></iframe>

</body>
</html>
